[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-claw"
version = "0.1.0"
description = "Self-hosted relay + client for Claude Code Remote Control (research)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
dependencies = []  # stdlib only by design

[project.scripts]
remote-claw = "remote_claw.cli:main"

[tool.setuptools]
packages = ["remote_claw"]

[tool.ruff]
line-length = 110
target-version = "py310"
# mitm/ holds the legacy capture tool + generated certs (research artifacts, not the package).
extend-exclude = ["captures", "mitm", ".state"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # long lines (embedded HTML/JS in client_api)
  "E741",   # ambiguous names in tight protocol code
]

[tool.ruff.lint.per-file-ignores]
# tests open log files handed to subprocess.Popen (must outlive the with-block);
# E402 = sys.path shim before imports.
"tests/*" = ["E402", "B008", "SIM115"]
