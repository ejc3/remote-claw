name: web

on:
  push:
    branches: [main]
    # web depends on cli + clawsec (workspace), so a change to either must re-run web CI.
    paths:
      ["apps/web/**", "packages/cli/**", "packages/clawsec/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/web.yml"]
  pull_request:
    paths:
      ["apps/web/**", "packages/cli/**", "packages/clawsec/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/web.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact workflow revision
        env:
          RC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${RC_EXPECTED_SHA}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install the whole pnpm workspace from the root single lockfile (cli + clawsec symlinked live).
      - run: pnpm install --frozen-lockfile
      - name: Lint + format check (Biome)
        run: pnpm --filter @remote-claw/web run check
      - name: Type check
        run: pnpm --filter @remote-claw/web run typecheck
      # Cheap (~3s) and independent of .next, so it goes before the build: a stale committed theme
      # fails in seconds instead of after a full Next + Workflow compile.
      - name: Theme drift (built artifacts match app/theme/remote-claw.ts)
        run: pnpm --filter @remote-claw/web run theme:check
      - name: Production build (Next + Workflow compiler) — proves the broker deploys
        run: pnpm --filter @remote-claw/web run build
      # BUILD BEFORE TEST, deliberately — the step above must stay above this one.
      # test/astryx-foundation.test.ts asserts on the CSS webpack actually EMITS into .next: the
      # cascade-layer, bare-selector and CSP guards are only truthful against the built artifact,
      # because the source reads correctly in both the broken and the fixed state. Under the previous
      # ordering the test found no build output and SKIPPED — the guard was silently absent from the one
      # place it was meant to protect. RC_CI=1 turns that skip into a hard failure, so a future
      # reordering breaks the build loudly instead of quietly disarming the test.
      - name: Integration tests (in-process Workflow runtime)
        run: RC_CI=1 pnpm --filter @remote-claw/web run test:run
