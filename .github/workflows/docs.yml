name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "tests/web/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "tests/web/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/docs.yml"]

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact workflow revision
        env:
          RC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${RC_EXPECTED_SHA}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install the whole pnpm workspace from the root single lockfile, then run the docs tests in
      # tests/web (a workspace member, so `--filter` runs playwright in its directory).
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter remote-claw-web-tests exec playwright install --with-deps chromium
      - run: pnpm --filter remote-claw-web-tests exec playwright test
