name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "AGENTS.md", "CLAUDE.md", "tests/web/docs.spec.ts", "tests/web/playwright.config.ts", "tests/web/package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "AGENTS.md", "CLAUDE.md", "tests/web/docs.spec.ts", "tests/web/playwright.config.ts", "tests/web/package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact workflow revision
        env:
          RC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${RC_EXPECTED_SHA}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install the whole pnpm workspace from the root single lockfile, then run the docs tests in
      # tests/web (a workspace member, so `--filter` runs playwright in its directory).
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter remote-claw-web-tests exec playwright install --with-deps chromium
      - run: pnpm --filter remote-claw-web-tests exec playwright test
