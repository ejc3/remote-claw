name: workspace

# Lockfile-integrity guard for the pnpm workspace. Every member (packages/*, apps/*, tests/*,
# spikes/*) shares ONE root pnpm-lock.yaml, so a manifest change in ANY member can desync it — and
# the per-package CI jobs only trigger on their own paths (a spikes/* or tests/* dep bump would slip
# through and then fail an unrelated job's frozen install later). This job runs on a change to ANY
# tracked package.json, vendored package bytes, the lockfile, or the workspace file, and fails loudly if the root lockfile is
# out of sync — so the desync is caught on the PR that introduced it.
on:
  push:
    branches: [main]
    paths: ["**/package.json", "vendor/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/workspace.yml"]
  pull_request:
    paths: ["**/package.json", "vendor/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/workspace.yml"]

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact workflow revision
        env:
          RC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${RC_EXPECTED_SHA}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Root lockfile is in sync with every workspace member
        run: pnpm install --frozen-lockfile
