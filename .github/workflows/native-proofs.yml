name: Native retained proofs

on:
  pull_request:
    paths:
      - "spikes/codex-multiclient/**"
      - "spikes/claude-native-output/**"
      - "spikes/opencode-native/**"
      - "packages/cli/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/native-proofs.yml"
  push:
    paths:
      - "spikes/codex-multiclient/**"
      - "spikes/claude-native-output/**"
      - "spikes/opencode-native/**"
      - "packages/cli/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/native-proofs.yml"

permissions:
  contents: read

jobs:
  retained-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The Claude verifier checks source blobs at its retained capture commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Require trace-contract prerequisites
        run: openssl version
      - name: Check proof sources
        run: pnpm --filter @remote-claw/codex-multiclient-proof run check
      - name: Verify retained evidence
        run: pnpm --filter @remote-claw/codex-multiclient-proof run test:run
      - name: Check Claude native-output proof sources
        run: pnpm --filter @remote-claw/claude-native-output-proof run check
      - name: Verify Claude native-output evidence and current trace contract
        run: pnpm --filter @remote-claw/claude-native-output-proof run test:run
      - name: Check OpenCode proof sources
        run: pnpm --filter @remote-claw/opencode-native-proof run check
      - name: Verify OpenCode retained evidence
        run: pnpm --filter @remote-claw/opencode-native-proof run test:run
