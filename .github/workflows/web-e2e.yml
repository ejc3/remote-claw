name: web-e2e

on:
  push:
    branches: [main]
    paths:
      ["apps/web/**", "packages/cli/**", "packages/clawsec/**", "tests/web/**", "vendor/**", "biome.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/web-e2e.yml"]
  pull_request:
    paths:
      ["apps/web/**", "packages/cli/**", "packages/clawsec/**", "tests/web/**", "vendor/**", "biome.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/web-e2e.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact workflow revision
        env:
          RC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${RC_EXPECTED_SHA}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check web product and browser-test sources
        run: pnpm exec biome ci apps/web tests/web
      - name: Typecheck the browser harness
        run: pnpm --filter remote-claw-web-tests run typecheck
      - name: Collect the one deployed smoke without running it
        run: pnpm --filter remote-claw-web-tests exec playwright test --list -c app-e2e.preview.config.ts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium + WebKit
        run: pnpm --filter remote-claw-web-tests exec playwright install --with-deps chromium webkit
      - name: Product browser test
        run: pnpm --filter remote-claw-web-tests run test:app
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/web/test-results/
          retention-days: 7
