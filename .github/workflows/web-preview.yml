name: web-preview-e2e

# Run the deployment-targeted e2e against the REAL broker on a Vercel deployment. This workflow is
# manual-only because deployment_status selects workflow bytes from the commit being deployed: a
# candidate-controlled workflow must never receive the Vercel bypass. An authenticated, typed
# repository dispatch supplies a deployment ID, never an arbitrary URL; GitHub selects this workflow
# from the default branch. The no-secret resolver then pins the GitHub deployment creator,
# project/team hostname, successful status, immutable SHA, and containment in main before the protected
# job exists.
on:
  repository_dispatch:
    types: [web-preview-e2e]

# The resolver always executes main's trusted script. Deployment code is checked out only after its SHA
# is proven to be on main; the workflow token remains read-only and unpersisted throughout. Repository
# configuration must keep release-proof credentials exclusively in the release-proof environment and
# admit only the branch `main`; candidate refs cannot access those credentials even if manually dispatched.
permissions:
  contents: read
  deployments: read

jobs:
  resolve-trusted-deployment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.resolve.outputs.trusted }}
      sha: ${{ steps.resolve.outputs.sha }}
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit-test the deployment trust resolver
        run: node --test scripts/resolve-trusted-vercel-deployment.test.mjs
      - name: Resolve Vercel deployment and bind it to trusted main
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_DEPLOYMENT_ID: ${{ github.event.client_payload.deployment_id }}
          RC_REQUIRE_TRUSTED: "1"
        run: node scripts/resolve-trusted-vercel-deployment.mjs

  e2e:
    needs: resolve-trusted-deployment
    if: needs.resolve-trusted-deployment.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    # This environment is a REQUIRED security boundary: store both referenced secrets only there,
    # require review, and allow only the branch `main` (not tags). This optional preview CI remains
    # distinct from the manual topology + plaintext-inspection release proof.
    environment: release-proof
    env:
      WEB_E2E_URL: ${{ needs.resolve-trusted-deployment.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Execute only the exact source independently proven above to be contained in trusted main.
          ref: ${{ needs.resolve-trusted-deployment.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Detect optional deployed-preview credentials
        id: optional_secrets
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TURSO_OPT_IN: ${{ secrets.TURSO_CLOUD_E2E }}
        run: |
          if [ -n "$BYPASS" ]; then echo "bypass=true" >> "$GITHUB_OUTPUT"; else echo "bypass=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$TURSO_OPT_IN" ]; then echo "turso=true" >> "$GITHUB_OUTPUT"; else echo "turso=false" >> "$GITHUB_OUTPUT"; fi
      # GitHub/Vercel metadata can name a mutable branch alias. Before any e2e can SEND the bypass,
      # prove that this exact pinned origin currently serves the resolved full SHA as a Vercel Preview.
      # This is a transport/topology gate only, not the final release proof or plaintext inspection.
      - name: Bind the served Preview bytes to the resolved SHA
        id: runtime_attestation
        if: ${{ steps.optional_secrets.outputs.bypass == 'true' }}
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ needs.resolve-trusted-deployment.outputs.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/attest-trusted-vercel-runtime.mjs
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Deployment-targeted e2e (real broker over HTTP)
        if: ${{ steps.optional_secrets.outputs.bypass != 'true' || steps.runtime_attestation.outputs.verified == 'true' }}
        env:
          # In this job the URL must resolve — make an empty URL a FAILURE, not a silent skip.
          WEB_E2E_REQUIRE: "1"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter @remote-claw/web run test:preview

      # The Playwright UI e2e against the deployed preview (the VERCEL backend). The e2e HOST runs as a
      # persistent test process (the seedHost fixture spawns a tsx host-runner) that talks to the deployed
      # broker via IDENTITY auth + the SSO bypass (VERCEL_AUTOMATION_BYPASS_SECRET) — it no longer uses
      # /api/dev/seed, so it needs NO seed token. Gated on the bypass secret, which is the real precondition:
      # both the browser and the host must clear the preview's Deployment-Protection (SSO) wall to reach it.
      # Until that secret is set this is skipped — web-preview stays green.
      - name: Install Chromium (UI e2e)
        if: ${{ steps.optional_secrets.outputs.bypass == 'true' && steps.runtime_attestation.outputs.verified == 'true' }}
        run: pnpm --filter remote-claw-web-tests exec playwright install --with-deps chromium
      - name: App UI e2e against the preview (vercel backend)
        if: ${{ steps.optional_secrets.outputs.bypass == 'true' && steps.runtime_attestation.outputs.verified == 'true' }}
        env:
          # The deployment default is SQLite; select the legacy Vercel backend explicitly so this leg
          # covers a distinct broker instead of duplicating the Turso-backed leg below.
          E2E_BACKEND: vercel
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter remote-claw-web-tests exec playwright test -c app-e2e.preview.config.ts

      # The SAME spec, flipped to the per-session SQLite backend on REAL Turso Cloud storage — the only
      # place the cloud locator's Platform-API create + group-token connect actually run. Identical UI
      # assertions, just routed via ?backend=sqlite. Needs the bypass (reach the preview) + the Turso Cloud
      # creds (TURSO_CLOUD_E2E). The resulting opaque test databases are retained: automated prefix-based
      # cleanup is disabled because a truncated scope cannot prove exact deployment ownership. Skipped until
      # both prerequisites are set, keeping web-preview green.
      - name: App UI e2e against the preview (sqlite — real Turso Cloud)
        if: ${{ steps.optional_secrets.outputs.bypass == 'true' && steps.runtime_attestation.outputs.verified == 'true' && steps.optional_secrets.outputs.turso == 'true' }}
        env:
          # Same transcript.spec, flipped to ?backend=sqlite. The host runs as the persistent test-process
          # host-runner (identity auth + SSO bypass), not /api/dev/seed — so no seed token here.
          E2E_BACKEND: sqlite
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter remote-claw-web-tests exec playwright test -c app-e2e.preview.config.ts
