name: web-preview-e2e

# A trusted default-branch dispatch supplies a GitHub deployment ID, never a URL. The first job binds
# that deployment to an immutable Vercel Preview on main without receiving deployment credentials.
on:
  repository_dispatch:
    types: [web-preview-e2e]

permissions:
  contents: read
  deployments: read

concurrency:
  group: deployed-web-smoke-${{ github.event.client_payload.deployment_id || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-deployment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.resolve.outputs.trusted }}
      sha: ${{ steps.resolve.outputs.sha }}
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve an immutable Vercel Preview on main
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_DEPLOYMENT_ID: ${{ github.event.client_payload.deployment_id }}
          RC_REQUIRE_TRUSTED: "1"
        run: node scripts/resolve-trusted-vercel-deployment.mjs

  smoke:
    needs: resolve-deployment
    if: needs.resolve-deployment.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    # Existing protected environment: keep the bypass unavailable to candidate-controlled workflows.
    environment: release-proof
    env:
      WEB_E2E_URL: ${{ needs.resolve-deployment.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deployment.outputs.sha }}
          persist-credentials: false
      - name: Assert exact deployed revision
        env:
          RC_EXPECTED_SHA: ${{ needs.resolve-deployment.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${RC_EXPECTED_SHA}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Require the deployment-protection bypass
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: test -n "$BYPASS"
      - name: Bind the served Preview to the resolved SHA
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ needs.resolve-deployment.outputs.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/attest-trusted-vercel-runtime.mjs
      - name: Install Chromium
        run: pnpm --filter remote-claw-web-tests exec playwright install --with-deps chromium
      - name: Deployed viewer and host smoke (default SQLite/Turso backend)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter remote-claw-web-tests exec playwright test -c app-e2e.preview.config.ts --fail-on-flaky-tests
