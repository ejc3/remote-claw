name: clawsec

on:
  push:
    branches: [main]
    paths:
      ["packages/clawsec/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/clawsec.yml"]
  pull_request:
    paths:
      ["packages/clawsec/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/clawsec.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact workflow revision
        env:
          RC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${RC_EXPECTED_SHA}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install the whole pnpm workspace from the root single lockfile (members are symlinked).
      - run: pnpm install --frozen-lockfile
      - name: Lint + format check (Biome)
        run: pnpm --filter @remote-claw/clawsec run check
      - name: Type check
        run: pnpm --filter @remote-claw/clawsec run typecheck
      - name: Unit tests
        run: pnpm --filter @remote-claw/clawsec run test:run
