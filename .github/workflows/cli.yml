name: cli

on:
  push:
    branches: [main]
    # cli depends on clawsec (workspace), so a clawsec change must re-run cli CI too.
    paths:
      ["packages/cli/**", "packages/clawsec/**", "scripts/build-cli.mjs", "scripts/test-installed-cli.mjs", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/cli.yml"]
  pull_request:
    paths:
      ["packages/cli/**", "packages/clawsec/**", "scripts/build-cli.mjs", "scripts/test-installed-cli.mjs", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/cli.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact workflow revision
        env:
          RC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${RC_EXPECTED_SHA}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint + format check (Biome)
        run: pnpm --filter @remote-claw/cli run check
      - name: Type check
        run: pnpm --filter @remote-claw/cli run typecheck
      - name: Unit + functional + e2e tests
        run: pnpm --filter @remote-claw/cli exec vitest run
      - name: Build, pack, install, and execute the standalone CLI artifact
        run: pnpm run test:install
