name: cli

on:
  push:
    branches: [main]
    # cli depends on clawsec (workspace), so a clawsec change must re-run cli CI too.
    paths:
      ["packages/cli/**", "packages/clawsec/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/cli.yml"]
  pull_request:
    paths:
      ["packages/cli/**", "packages/clawsec/**", "pnpm-workspace.yaml", "pnpm-lock.yaml", "package.json", ".github/workflows/cli.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install the whole pnpm workspace from the root single lockfile (members are symlinked).
      - run: pnpm install --frozen-lockfile
      - name: Lint + format check (Biome)
        run: pnpm --filter @remote-claw/cli run check
      - name: Type check
        run: pnpm --filter @remote-claw/cli run typecheck
      - name: Unit + functional + e2e tests
        run: pnpm --filter @remote-claw/cli run test:run
