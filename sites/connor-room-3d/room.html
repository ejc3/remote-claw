<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connor's Room — 3D Walkthrough</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e0b07;
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;}
  #c{width:100%;height:100%;display:block;touch-action:none;}
  .hud{position:absolute;display:flex;gap:8px;flex-wrap:wrap;z-index:5;}
  .brand{top:calc(12px + env(safe-area-inset-top));left:16px;flex-direction:column;gap:2px;}
  .brand b{color:#f3ebd9;font-size:15px;letter-spacing:.02em;}
  .brand span{color:#c53024;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;
    letter-spacing:.22em;text-transform:uppercase;}
  .views{top:calc(12px + env(safe-area-inset-top));right:12px;}
  .panel{bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;
    justify-content:flex-start;align-items:flex-end;}
  .grp{background:rgba(14,11,7,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(243,235,217,.18);border-radius:12px;padding:8px 10px;
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .grp .lbl{color:#9d8d74;font-family:ui-monospace,Menlo,monospace;font-size:9px;
    letter-spacing:.18em;text-transform:uppercase;width:100%;}
  button{appearance:none;border:1px solid rgba(243,235,217,.25);background:transparent;
    color:#e8dfca;border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:inherit;min-height:32px;}
  button.on{background:#c53024;border-color:#c53024;color:#fff;}
  button:active{transform:scale(.96);}
  .views button{background:rgba(14,11,7,.72);backdrop-filter:blur(10px);}
  #tourBtn{background:#d8b45f;border-color:#d8b45f;color:#231a08;}
  #fitnote{position:absolute;top:calc(58px + env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);background:rgba(20,16,10,.85);color:#ffd9a8;
    border:1px solid rgba(216,180,95,.5);border-radius:10px;padding:8px 14px;
    font-size:12.5px;display:none;z-index:6;max-width:86vw;text-align:center;}
  #hint{position:absolute;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);color:rgba(243,235,217,.55);font-size:11.5px;z-index:4;
    pointer-events:none;text-align:center;transition:opacity 1s;}
  @media(max-width:720px){
    .grp{padding:6px 8px;}
    button{padding:6px 9px;font-size:11.5px;}
    .views{flex-wrap:wrap;justify-content:flex-end;max-width:44vw;}
  }
</style>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud brand"><b>Connor’s Room · 3D</b><span>Ink &amp; Grain</span></div>
  <div class="hud views">
    <button data-view="door">Door</button>
    <button data-view="bed">Bed</button>
    <button data-view="desk">Desk</button>
    <button data-view="window">Window</button>
    <button data-view="above">Above</button>
    <button id="tourBtn">▶ Tour</button>
  </div>
  <div id="fitnote"></div>
  <div id="hint">drag to look · pinch or scroll to move closer · buttons to jump · tap to stop the tour</div>
  <div class="hud panel">
    <div class="grp"><span class="lbl">Library (under window)</span>
      <button data-opt="library:console" class="on">Tate 80″ console</button>
      <button data-opt="library:towers">78″ towers</button>
      <button data-opt="library:dresser">62″ dresser</button>
    </div>
    <div class="grp"><span class="lbl">Desk</span>
      <button data-opt="desk:60" class="on">Tate 60″</button>
      <button data-opt="desk:48">Tate 48″</button>
    </div>
    <div class="grp"><span class="lbl">Paint</span>
      <button data-opt="paint:atelier" class="on">Atelier</button>
      <button data-opt="paint:plain">All parchment</button>
    </div>
    <div class="grp"><span class="lbl">Time</span>
      <button data-opt="time:day" class="on">Day</button>
      <button data-opt="time:night">Night</button>
    </div>
  </div>
</div>
